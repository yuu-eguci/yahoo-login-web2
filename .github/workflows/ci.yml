name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Type check and test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26: Active LTS (used by Docker). 24: App Engine runtime `nodejs24`.
        node-version: ['26', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker build and mocked login flow
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.mock.yaml
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: docker compose --profile test build
      - name: Type check and test in the container
        run: docker compose run --rm test
      - name: Start the app with the mock Yahoo endpoints
        run: docker compose up --wait
      - name: Smoke-test the mocked login flow
        run: docker compose run --rm test node test/smoke/mocked-login.ts
      - name: Check the app from the host
        run: |
          curl --fail --silent --show-error http://localhost:3000/ | grep -q "clientId: 'synthetic-client-id'"
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down
